services:
  - type: web
    name: cultura-zaragoza
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 180 "app:create_app()"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: EVENT_CACHE_TTL_SECONDS
        value: "3600"
